name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore UserSecretManager.slnx --locked-mode
      - name: Format check
        run: dotnet format UserSecretManager.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build UserSecretManager.slnx -c Release --no-restore
      - name: Test
        run: dotnet test UserSecretManager.slnx -c Release --no-build
      - name: Vulnerable packages
        run: dotnet list UserSecretManager.slnx package --vulnerable --include-transitive
